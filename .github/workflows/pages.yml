name: Test, refresh Eurostat data, publish Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run JavaScript and Python tests with individual evidence
        run: npm run test:report
      - name: Show every test result in GitHub Actions summary
        if: always()
        run: |
          if [ -f test-results/test-report.md ]; then
            cat test-results/test-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "TEST REPORT NOT PRODUCED — check earlier setup or runner failure." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve per-test report and raw diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: explained-test-results
          path: test-results/
          if-no-files-found: warn
          retention-days: 90
      - run: npm run data:refresh
      - run: npm run context:refresh
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
