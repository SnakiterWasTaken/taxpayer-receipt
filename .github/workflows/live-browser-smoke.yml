name: Live V1 browser acceptance
on:
  pull_request:
    paths:
      - 'scripts/live-browser-smoke.mjs'
      - '.github/workflows/live-browser-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  published-site:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless Chromium smoke test runner
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check live GitHub Pages with synthetic personal data
        env:
          V1_SITE_URL: https://snakiterwastaken.github.io/taxpayer-receipt/
        run: node scripts/live-browser-smoke.mjs
      - name: Preserve evidence and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1-live-browser-evidence
          path: test-results/live-browser/
          if-no-files-found: warn
          retention-days: 30
