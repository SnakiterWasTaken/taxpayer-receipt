name: Validate
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure a durable handover entry accompanies code changes
        if: github.event_name == 'pull_request'
        run: |
          git diff --name-only "origin/$GITHUB_BASE_REF...HEAD" > /tmp/changed-files.txt
          if grep -Eq '^(src/|scripts/|tests/|\.github/workflows/|index\.html$|styles\.css$)' /tmp/changed-files.txt; then
            if ! grep -Fxq 'docs/TEST_LOG.md' /tmp/changed-files.txt; then
              echo "Changes to code, tests or workflows require a dated explanation in docs/TEST_LOG.md."
              exit 1
            fi
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run JavaScript and Python tests with individual evidence
        run: npm run test:report
      - name: Show every test result in GitHub Actions summary
        if: always()
        run: |
          if [ -f test-results/test-report.md ]; then
            cat test-results/test-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "TEST REPORT NOT PRODUCED — check earlier setup or runner failure." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve per-test report and raw diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: explained-test-results
          path: test-results/
          if-no-files-found: warn
          retention-days: 90
      - name: Probe original Czech December 2024 FIN source ZIP (metadata only)
        id: fin_probe
        continue-on-error: true
        run: python3 scripts/probe-fin-2024.py --only all
      - name: Preserve official-source probe and unresolved errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cz-fin-source-metadata
          path: test-results/fin-2024-source-probe.json
          if-no-files-found: warn
          retention-days: 90
      - name: Show FIN source verification status in workflow
        if: always()
        run: |
          echo "## Original MONITOR FIN 2024 source probe" >> "$GITHUB_STEP_SUMMARY"
          if [ -f test-results/fin-2024-source-probe.json ]; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open("test-results/fin-2024-source-probe.json"))
          for x in d["datasets"]:
              print("- **"+x["dataset"]+"**: "+x["status"])
              print("  - Archive SHA-256: "+x.get("sha256","NOT VERIFIED"))
              print("  - "+x.get("failureExplanation","ZIP downloaded and CSV schema sample inspected. No budget decisions validated."))
          PY
          else
            echo "BLOCKED: no original-source metadata was produced." >> "$GITHUB_STEP_SUMMARY"
          fi
      - run: npm run data:refresh
      - run: npm run institutional:refresh
      - run: npm run context:refresh
      - run: npm run build
