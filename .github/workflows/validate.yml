name: Validate
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Run EUROMOD integration unit tests (no external model required)
        run: python3 -m unittest discover -s tests -p 'test_euromod*.py'
      - run: npm run context:refresh
      - run: npm run build
